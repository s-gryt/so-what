name: test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash skills/so-what/scripts/test.sh
  awk-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mawk gawk
      - name: test with mawk
        run: AWK=mawk bash skills/so-what/scripts/test.sh
      - name: test with gawk
        run: AWK=gawk bash skills/so-what/scripts/test.sh
