name: test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node skills/so-what/scripts/test.mjs
      - run: node skills/so-what/evals/selftest.mjs
